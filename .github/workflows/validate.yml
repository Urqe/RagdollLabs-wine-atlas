name: Validate Wine Atlas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked test dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate code, data and regressions
        run: |
          set -o pipefail
          if ! npm run validate 2>&1 | tee validate.log; then
            # Surface the failure in the PR checks view, not only in the raw log.
            summary=$(tail -n 40 validate.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Validation failed::${summary}"
            exit 1
          fi
