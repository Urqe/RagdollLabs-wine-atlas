<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Stylized vineyard at golden hour</title>
  <desc id="desc">A warm evening vineyard with receding vine rows, a ragdoll cat seated at the table, and wine glass and decanter silhouettes in the foreground.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f5f54"/>
      <stop offset="0.48" stop-color="#b7835f"/>
      <stop offset="1" stop-color="#473329"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b4b35"/>
      <stop offset="1" stop-color="#1e1816"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe8a6" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#eab86b" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1600" height="760" fill="url(#sky)"/>
  <circle cx="1120" cy="168" r="150" fill="url(#sun)" filter="url(#soft)"/>
  <circle cx="1120" cy="168" r="44" fill="#f6d58e" opacity="0.82"/>

  <path d="M0 374 C220 312 442 344 640 322 C860 297 1052 325 1250 296 C1380 277 1492 284 1600 300 L1600 760 L0 760 Z" fill="#3a3325" opacity="0.85"/>
  <path d="M0 446 C246 390 430 420 658 390 C900 358 1140 385 1600 335 L1600 760 L0 760 Z" fill="url(#ground)"/>

  <!-- Vineyard rows deliberately converge toward the horizon to create depth without photorealistic detail. -->
  <g fill="none" stroke="#6f7650" stroke-width="15" stroke-linecap="round" opacity="0.78">
    <path d="M80 760 Q380 540 760 390"/>
    <path d="M280 760 Q520 535 825 388"/>
    <path d="M520 760 Q650 520 895 384"/>
    <path d="M790 760 Q800 515 965 382"/>
    <path d="M1080 760 Q958 520 1030 382"/>
    <path d="M1370 760 Q1110 530 1092 384"/>
  </g>
  <g fill="none" stroke="#94845d" stroke-width="3" opacity="0.55">
    <path d="M90 724 Q382 526 758 392"/>
    <path d="M292 724 Q526 520 824 390"/>
    <path d="M533 724 Q658 510 894 387"/>
    <path d="M803 724 Q808 505 963 385"/>
    <path d="M1065 724 Q958 510 1029 385"/>
    <path d="M1344 724 Q1116 518 1090 386"/>
  </g>

  <!-- The mascot sits at the table behind the glassware, so the wine scene remains foreground. -->
  <g id="landing-ragdoll" transform="translate(1222 285) scale(.82)" opacity=".98"><defs><linearGradient id="cat-fur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1e8dc"/><stop offset="1" stop-color="#cbbbae"/></linearGradient><linearGradient id="cat-points" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#51444b"/><stop offset="1" stop-color="#2f262d"/></linearGradient></defs><ellipse cx="169" cy="331" rx="112" ry="17" fill="#0d090b" opacity=".34"/><path d="M95 173c-23 23-34 59-29 96 4 31 19 58 40 66 23 9 38-6 54-6 19 0 36 17 62 7 27-10 42-45 39-82-3-43-23-76-54-91-28-13-83-11-112 10z" fill="url(#cat-fur)"/><path d="M97 247c-14 18-23 42-18 63 6 25 28 35 50 23 13-7 20-19 25-34-21 7-39-12-57-52z" fill="#e7ddd1" opacity=".9"/><path d="M218 251c22 8 42 26 49 46 9 25-2 43-25 41-20-2-33-18-40-39 15 1 27-14 16-48z" fill="#b9a99f" opacity=".9"/><path d="M104 77 84 30l55 30c18-6 44-6 64 1l52-31-18 50c16 18 22 43 16 68-9 39-42 65-84 65-44 0-79-27-86-68-4-25 3-49 21-68z" fill="url(#cat-fur)"/><path d="M91 39 104 87l36-28zM246 40l-10 49-35-29z" fill="url(#cat-points)"/><path d="M118 91c13-25 29-34 50-34 24 0 42 13 55 37-10 4-18 15-20 28-3 24-17 42-36 42-20 0-33-18-36-42-2-13-6-24-13-31z" fill="url(#cat-points)" opacity=".93"/><ellipse cx="142" cy="113" rx="12" ry="9" fill="#e9f8ff"/><ellipse cx="195" cy="113" rx="12" ry="9" fill="#e9f8ff"/><ellipse cx="143" cy="113" rx="5" ry="7" fill="#69bde7"/><ellipse cx="194" cy="113" rx="5" ry="7" fill="#69bde7"/><circle cx="145" cy="111" r="2" fill="#fff"/><circle cx="196" cy="111" r="2" fill="#fff"/><path d="M161 136c5-4 11-4 16 0-3 7-12 7-16 0z" fill="#8e5c6e"/><path d="M169 143c-1 9-7 13-14 14M169 143c1 9 7 13 14 14" fill="none" stroke="#42343c" stroke-width="2" stroke-linecap="round"/><path d="M127 141c-19 0-34 4-45 11M128 149c-18 4-31 10-40 19M211 141c18 0 33 4 44 11M210 149c18 4 31 10 40 19" fill="none" stroke="#8a7a7f" stroke-width="1.6" stroke-linecap="round" opacity=".8"/><path d="M116 190c14 14 31 22 52 22 22 0 40-8 55-23-7 36-25 57-54 57-29 0-47-20-53-56z" fill="#f5eee4" opacity=".8"/><path d="M234 262c46-17 69 8 54 32-11 18-35 17-55 4 16 7 30 3 34-7 7-16-9-28-33-18z" fill="url(#cat-points)"/></g>

  <!-- Foreground table and glassware remain silhouettes so text overlays stay readable. -->
  <ellipse cx="1324" cy="698" rx="360" ry="150" fill="#120d10" opacity="0.82"/>
  <!-- Clear tulip bowl and broad-bottomed decanter, painted after the cat. -->
  <g stroke="#d4b77e" stroke-width="3" stroke-linejoin="round">
    <path d="M1168 375 Q1164 443 1193 483 Q1214 510 1240 510 Q1266 510 1287 483 Q1316 443 1312 375 Z" fill="#171017" fill-opacity=".84"/>
    <ellipse cx="1240" cy="375" rx="72" ry="12" fill="#271b21" fill-opacity=".65"/>
    <path d="M1183 444 Q1240 457 1297 444 Q1288 495 1240 499 Q1192 495 1183 444Z" fill="#78253f" fill-opacity=".8" stroke="none"/>
    <path d="M1240 510 V638 M1198 650 Q1240 642 1282 650" fill="none"/>
    <path d="M1451 328 L1480 328 Q1470 348 1475 386 L1482 432 Q1488 468 1522 508 Q1562 554 1554 601 Q1483 623 1378 601 Q1370 559 1410 513 Q1448 470 1453 432 L1459 386 Q1464 348 1451 328Z" fill="#171017" fill-opacity=".86"/>
    <path d="M1450 328 Q1468 317 1490 326" fill="none"/>
    <path d="M1396 560 Q1470 574 1537 560 L1540 590 Q1471 606 1390 590Z" fill="#78253f" fill-opacity=".72" stroke="none"/>
    <path d="M1183 392 Q1181 425 1194 445 M1468 348 L1469 411 M1500 494 Q1534 540 1539 554" fill="none" stroke="#f2dfb4" stroke-opacity=".5" stroke-width="4" stroke-linecap="round"/>
  </g>

  <rect width="1600" height="760" fill="#0e0a0c" opacity="0.06"/>
</svg>
